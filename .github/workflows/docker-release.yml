# Publishes immutable multi-arch image tags to DockerHub on a version tag.
#
# This workflow never modifies :latest. It publishes only :vX.Y.Z and :<short-sha>.
# Moving :latest is a separate manual step (docker-promote-latest.yml) that copies an
# already-published digest, so :latest always resolves to a verified image.
#
# Release steps:
#   1. Set "version" in package.json and merge to main
#   2. task tag-rc RC=1   publishes v1.0.0-rc.1
#   3. task tag           publishes v1.0.0
#   4. Run "Promote Docker Image to :latest" against the verified tag

name: Release Docker Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Fixed group, not ref-scoped, so concurrent tag pushes cannot race on the registry.
# Shared with the promote workflow.
concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE_NAME: keeper/gchat-app

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # Checked out by resolved SHA rather than by ref, so a tag moved mid-run cannot
      # cause one commit to be validated and another shipped.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify tag format and version parity
        id: check
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::Tag '$TAG' must be vMAJOR.MINOR.PATCH[-prerelease], e.g. v1.0.0 or v1.0.0-rc.1"
            exit 1
          fi
          BASE="${BASH_REMATCH[1]}"
          PRE="${BASH_REMATCH[3]}"

          PKG="$(node -p "require('./package.json').version")"
          if [ "$BASE" != "$PKG" ]; then
            echo "::error::Tag '$TAG' (version $BASE) does not match package.json version '$PKG'"
            exit 1
          fi

          if [ -n "$PRE" ]; then PRERELEASE=true; else PRERELEASE=false; fi
          {
            echo "version=$TAG"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Version check passed: $TAG (version $BASE, prerelease=$PRERELEASE)"

      - name: Tag must be reachable from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/${DEFAULT_BRANCH}; refusing to release"
            exit 1
          fi
          echo "Commit is on ${DEFAULT_BRANCH}"

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      # BuildKit provides its own emulators for cross-platform builds. QEMU is registered
      # here so the arm64 image can also be executed in the smoke test below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version tags are immutable: a re-run or a moved tag must not replace a digest that
      # may already be deployed.
      - name: Refuse to overwrite a published version tag
        run: |
          set -uo pipefail
          REF="${IMAGE_NAME}:${{ needs.validate.outputs.version }}"
          out="$(docker buildx imagetools inspect "$REF" 2>&1)" && rc=0 || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::$REF already exists on DockerHub. Bump the version instead."
            exit 1
          fi
          if ! grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN' <<<"$out"; then
            echo "::error::Could not confirm whether $REF exists, failing closed. Registry response: $out"
            exit 1
          fi
          echo "OK: $REF is not yet published"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Set explicitly: the default depends on repository visibility, and on a
          # multi-arch build it appends unknown/unknown attestation manifests.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Keeper Google Chat App
            org.opencontainers.image.description=Self-hosted Keeper Google Chat app for credential access requests and approval workflows
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Keeper-Security/google-chat-integration
            org.opencontainers.image.vendor=Keeper Security Inc.
          # Reads the cache written by ci.yml on the default branch. No cache-to: Actions
          # caches are ref-scoped, so a tag run's cache is unreadable by later releases.
          cache-from: type=gha,scope=gchat-app

      # Referenced by tag rather than by digest: a digest pins one manifest, so `docker run`
      # rejects --platform against it with "cannot overwrite digest".
      - name: Smoke test both architectures
        env:
          REF: ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "--- $platform"
            docker pull --quiet --platform "$platform" "$REF"
            docker run --rm --platform "$platform" --entrypoint node "$REF" \
              -e 'console.log(process.arch, process.version)'
            out="$(docker run --rm --platform "$platform" "$REF" 2>&1 || true)"
            if ! grep -q 'Missing configuration' <<<"$out"; then
              echo "::error::$platform did not exit with the expected configuration error"
              printf '%s\n' "$out"
              exit 1
            fi
            echo "$platform OK"
          done

      - name: Summary
        run: |
          {
            echo "### Published \`${IMAGE_NAME}\`"
            echo
            echo "- \`${IMAGE_NAME}:${{ needs.validate.outputs.version }}\`"
            echo "- \`${IMAGE_NAME}:${{ needs.validate.outputs.short_sha }}\`"
            echo "- digest \`${{ steps.build.outputs.digest }}\`"
            echo "- prerelease: \`${{ needs.validate.outputs.prerelease }}\`"
            echo
            echo ':latest was not modified. Run **Promote Docker Image to :latest** once this tag is verified.'
          } >> "$GITHUB_STEP_SUMMARY"
