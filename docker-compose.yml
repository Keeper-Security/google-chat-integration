services:
  # Example production stack (KSM). Values come from vault via KSM_CONFIG.
  # Local development can keep using a single google-chat-app + config.yaml mount.

  commander-gchat:
    container_name: keeper-service-gchat
    ports:
      - "127.0.0.1:8900:8900"
    image: keeper/commander:latest
    command: >-
      service-create -p 8900
      -c 'search,share-record,nsf-share-record,share-folder,nsf-share-folder,share-report,record-add,nsf-record-add,one-time-share,epm,pedm,device-approve,get,tree,server,sync-down,list-sf,list-team'
      -f json -q y
      -ur REPLACE_USER_UID
      --ksm-config REPLACE_COMMANDER_KSM_CONFIG
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8900/health', timeout=2).status == 200 else 1)"
      interval: 60s
      timeout: 3s
      start_period: 10s
      retries: 30
    restart: unless-stopped

  gchat-app:
    build: .
    container_name: keeper-gchat-app
    image: keeper/gchat-app:latest
    init: true
    environment:
      KSM_CONFIG: REPLACE_APP_KSM_CONFIG
      COMMANDER_RECORD: CSMD config
      GCHAT_RECORD: CSMD google chat config
      # Optional: COMMANDER_HOST=commander-gchat
      NODE_ENV: production
    depends_on:
      commander-gchat:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # --- Local development alternative (YAML + SA file, no KSM) ---
